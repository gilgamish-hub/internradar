{% extends "base.html" %}
{% block title %}Sign in &mdash; {{ brand }}{% endblock %}
{% block wrapclass %}narrow{% endblock %}

{% block body %}
<h1>Sign in</h1>
<form method="post" class="card">
  <label class="lbl" for="email">Email</label>
  <input type="email" id="email" name="email" required autocomplete="username"
         value="{{ email or '' }}">
  <label class="lbl" for="password">Password</label>
  <input type="password" id="password" name="password" required autocomplete="current-password">
  <p style="margin-top:20px"><button class="btn" type="submit">Sign in</button></p>
  <p class="muted small" style="margin:0">
    Not enrolled yet? <a href="{{ url_for('signup') }}">Enroll instead</a> &mdash; it is free.
  </p>
</form>
{% endblock %}
