{% extends "base.html" %}
{% block title %}Sign in — {{ brand }}{% endblock %}
{% block wrapclass %}narrow{% endblock %}

{% block body %}
<div class="stack lg" style="max-width:420px; margin:28px auto 0">
  <div>
    <h1>Sign in</h1>
    <p class="muted" style="margin-top:6px">Your internships are waiting on the other side.</p>
  </div>

  <form method="post" class="card">
    <div class="body stack">
      <div>
        <label class="lbl" for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username"
               value="{{ email or '' }}" autofocus>
      </div>
      <div>
        <label class="lbl" for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <div><button class="btn" type="submit" style="width:100%">Sign in</button></div>
    </div>
    <div class="foot">
      <span class="small muted">New here? <a href="{{ url_for('signup') }}">Enroll instead</a> — it is free.</span>
    </div>
  </form>
</div>
{% endblock %}
